name: KAELIX QA and customer inquiry intake

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  qa:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout tested product and storefront
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify storefront, request forms and on-page JavaScript
        run: python3 -m unittest -v tests/test_site.py
      - name: Verify local data audit starter
        working-directory: examples/kaelix-data-audit
        run: python3 -m unittest -v test_csv_audit.py

  acknowledge:
    if: |
      github.event_name == 'issues' &&
      (startsWith(github.event.issue.title, '[KAELIX Service]') ||
       startsWith(github.event.issue.title, '[Cerere]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Acknowledge an explicit inbound request
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue || issue.pull_request) return;
            const title = issue.title || '';
            const isService = title.startsWith('[KAELIX Service]');
            const isSolana = title.startsWith('[Cerere]');
            if (!isService && !isSolana) return;
            const marker = '<!-- KAELIX_INBOUND_ACK_V1 -->';
            const existing = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100
            });
            if (existing.some(c => (c.body || '').includes(marker))) return;
            const message = isService
              ? 'Thanks for submitting a KAELIX Studio inquiry. This is a **public, free quote request**, not a paid order. A scoped quote requires review of the expected input/output, synthetic example, budget and acceptance criteria. **Do not post secrets, production customer data or private repository content here.** Please do not send funds to addresses shared in comments. We will not consider the work accepted or payable until both sides explicitly agree on scope and terms.'
              : 'Mulțumim pentru cererea KAELIX Solana Sentinel. Aceasta este o **cerere publică și gratuită de ofertă**, nu o comandă confirmată sau plătită. Vom verifica cerințele și vom stabili explicit livrabilele și condițiile. **Nu publica seed phrase, chei private sau informații personale aici.** Nu trimite fonduri către adrese postate în comentarii.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: marker + '\n' + message
            });
